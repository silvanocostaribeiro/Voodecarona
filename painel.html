<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOO Painel PRO com GPS</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f0f4f8}.topo{background:#0a2540;color:#fff;padding:12px 15px;display:flex;justify-content:space-between}.box{background:#fff;margin:10px;padding:12px;border-radius:12px;display:flex;justify-content:space-between;align-items:center}.switch{width:60px;height:32px;background:#ccc;border-radius:20px;position:relative;cursor:pointer}.switch.ativo{background:#00c853}.bola{width:28px;height:28px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:.3s}.switch.ativo .bola{left:30px}#map{height:300px;width:100%}.card{background:#fff;margin:10px;padding:14px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;margin-top:8px;cursor:pointer}.btn-verde{background:#00c853;color:#fff}.btn-azul{background:#0a2540;color:#fff}.btn-laranja{background:#ff9800;color:#fff}</style></head><body><div class="topo"><div><b>🚗 VOO MOTORISTA</b><br><small>Silvano | Gol 2015</small></div><div style="text-align:right"><small>SALDO</small><br><b>R$ <span id="saldo">0,00</span></b></div></div><div class="box"><div><b id="st">🔴 OFFLINE</b><br><small id="sub">Ative pra receber</small></div><div class="switch" id="sw" onclick="toggle()"><div class="bola"></div></div></div><div id="map"></div><div id="area"><div class="card" style="text-align:center">📡 Fique ONLINE pra ver corridas em Conquista<br><br>GPS grátis ativo!</div></div><script>let on=false,sd=0,lat=-14.861,lng=-40.844,map,mark,rota;map=L.map('map').setView([lat,lng],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);mark=L.marker([lat,lng]).addTo(map).bindPopup("Você aqui").openPopup();if(navigator.geolocation){navigator.geolocation.watchPosition(p=>{lat=p.coords.latitude;lng=p.coords.longitude;mark.setLatLng([lat,lng])})}function km(a,b,c,d){const R=6371;const d1=(c-a)*Math.PI/180;const d2=(d-b)*Math.PI/180;const aa=Math.sin(d1/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(d2/2)**2;return R*2*Math.atan2(Math.sqrt(aa),Math.sqrt(1-aa))}function toggle(){on=!on;document.getElementById('sw').classList.toggle('ativo',on);document.getElementById('st').innerText=on?'🟢 ONLINE - GPS ATIVO':'🔴 OFFLINE';document.getElementById('sub').innerText=on?'Buscando corridas...':'Fique online';if(on)buscar();else document.getElementById('area').innerHTML='<div class=card style=text-align:center>Offline</div>'}function buscar(){document.getElementById('area').innerHTML='<div class=card style=text-align:center>📡 Procurando passageiro perto...</div>';setTimeout(mostrar,2000)}function mostrar(){const o={lat:-14.864,lng:-40.835,n:"Shopping Conquista Sul"};const d={lat:-14.886,lng:-40.807,n:"UESB Campus"};const kb=km(lat,lng,o.lat,o.lng).toFixed(1);const kl=km(o.lat,o.lng,d.lat,d.lng).toFixed(1);const tot=(parseFloat(kb)+parseFloat(kl)).toFixed(1);const val=(kl*2.8+4).toFixed(2);const vkm=(val/kl).toFixed(2);if(rota)map.removeLayer(rota);rota=L.polyline([[lat,lng],[o.lat,o.lng],[d.lat,d.lng]],{color:'#0a2540',weight:6}).addTo(map);map.fitBounds(rota.getBounds(),{padding:[30,30]});if(navigator.vibrate)navigator.vibrate([300,100,300]);document.getElementById('area').innerHTML='<div class=card style=border-left:6px solid #00c853><b>🔔 NOVA CORRIDA!</b><br><br>📍 Buscar: '+o.n+'<br>🏁 Levar: '+d.n+'<br><br>🚗 Até passageiro: <b>'+kb+' km</b><br>🛣️ Corrida: <b>'+kl+' km</b><br>📏 Total: <b>'+tot+' km</b><br><br>💰 Valor: <b style=color:#00c853;font-size:22px>R$ '+val+'</b><br>💵 Por KM: <b>R$ '+vkm+'/km</b><br>👤 Ana - ⭐4.9<br><br><button class=btn btn-verde onclick=aceitar('+val+')>✅ ACEITAR R$ '+val+'</button><button class=btn style=background:#eee onclick=buscar()>❌ RECUSAR</button></div>'}function aceitar(v){document.getElementById('area').innerHTML='<div class=card style=border-left:6px solid #0a2540><b>🚗 CORRIDA ACEITA!</b><br><br>Valor R$ '+v+'<br><br><a href=https://wa.me/5577999999999?text=Olá,%20sou%20seu%20motorista%20VOO!%20Estou%20a%20caminho!%20'+km(lat,lng,-14.864,-40.835).toFixed(1)+'km%20de%20você%20🚗 target=_blank><button class=btn btn-azul>💬 ESTOU A CAMINHO</button></a><button class=btn btn-laranja onclick=cheguei('+v+')>📍 CHEGUEI NO LOCAL</button></div>'}function cheguei(v){document.getElementById('area').innerHTML='<div class=card><b>📍 CHEGUEI!</b><br><br><a href=https://wa.me/5577999999999?text=Cheguei!%20Estou%20na%20entrada%20principal%20🚗 target=_blank><button class=btn btn-azul>💬 AVISAR QUE CHEGUEI</button></a><button class=btn btn-verde onclick=finalizar('+v+')>▶️ INICIAR E FINALIZAR</button></div>'}function finalizar(v){sd+=v;document.getElementById('saldo').innerText=sd.toFixed(2).replace('.',',');document.getElementById('area').innerHTML='<div class=card style=background:#e8f5e9;text-align:center><b>✅ +R$ '+v+'</b><br>Corrida finalizada!</div>';setTimeout(buscar,3000)}</script></body></html>
