<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOO Cadastro</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a2540;display:flex;justify-content:center;padding:20px}.card{background:#fff;width:100%;max-width:380px;border-radius:16px;padding:22px;text-align:center}h1{color:#0a2540;margin-bottom:5px}input{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}.btn{width:100%;padding:15px;background:#00c853;color:#fff;border:none;border-radius:10px;font-weight:bold;margin-top:12px;font-size:17px;cursor:pointer}</style></head><body><div class="card"><h1>🚗 VOO</h1><p>Cadastro Motorista<br>Vitória da Conquista</p><br><input id="nome" placeholder="Seu nome completo"><input id="zap" placeholder="WhatsApp (77) 9..."><input id="carro" placeholder="Carro - ex: Gol 2015 Branco"><input id="placa" placeholder="Placa - ex: ABC1234"><button class="btn" onclick="ir()">✅ CADASTRAR E ABRIR PAINEL</button></div><script>function ir(){let n=document.getElementById('nome').value;if(n.length<3){alert('Digite seu nome');return}location.href='painel.html?nome='+encodeURIComponent(n)}</script></body></html>
