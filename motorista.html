<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOO Motorista</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f0f0f0}.topo{background:#000;color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1000}.sw{width:62px;height:34px;background:#333;border-radius:20px;position:relative}.sw.on{background:#00c853}.bola{width:28px;height:28px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:.3s}.sw.on .bola{left:31px}#map{height:40vh;width:100%}.card{background:#fff;margin:10px;border-radius:20px;padding:16px;box-shadow:0 4px 10px rgba(0,0,0,.15)}.btn{width:100%;padding:16px;border:none;border-radius:14px;font-weight:bold;font-size:17px;margin-top:8px}.btnV{background:#00c853;color:#fff}.btnL{background:#ff8c00;color:#fff}.btnP{background:#000;color:#fff}.btnPix{background:#32bcad;color:#fff}.et{display:none}.et.on{display:block}.navTop{background:#000;color:#fff;padding:10px;display:none;justify-content:space-between;position:sticky;top:62px;z-index:900}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;color:#00ff88;padding:12px 20px;border-radius:30px;display:none;z-index:9999;font-weight:bold}#qrBox{display:none;background:#f2f2f2;border:2px dashed #000;border-radius:16px;padding:12px;text-align:center;margin-top:10px}</style>
</head><body>
<div class="topo"><div><b>🚗 VOO</b> • R$ <span id="saldo">0,00</span></div><div style="text-align:center"><div class="sw" id="sw" onclick="toggle()"><div class="bola"></div></div><br><small id="txt">OFFLINE</small></div></div>
<div class="navTop" id="navTop"><div><small>GPS DENTRO DO APP</small><br><b id="navInst" style="color:#00ff88">Siga</b></div><div><b id="navDist">0 km</b></div></div>
<div id="map"></div><div class="toast" id="toast"></div>

<div class="card et on" id="off"><center><b>🔴 OFFLINE</b><br>Fique ONLINE</center></div>

<div class="card et" id="on" style="border:3px solid #00c853"><b>🔔 NOVA CORRIDA</b> <span id="kmTop">0</span><br><br>📍 BUSCAR: <b id="kmB">0</b> | 🏁 LEVAR: <b id="kmL">0</b><br>💳 <b id="pagForma">DINHEIRO</b> <small id="pagStatus" style="color:red"></small><h1 style="text-align:center" id="valor">R$ 0</h1><button class="btn btnV" onclick="aceitar()">✅ ACEITAR</button></div>

<div class="card et" id="run" style="text-align:center;border:3px solid #000"><h3>🚗 EM CORRIDA - GPS DENTRO</h3><p style="background:#000;color:#fff;padding:8px;border-radius:10px;margin:8px 0">Maria • <span id="runValor">R$ 0</span> • <span id="runPag">DINHEIRO</span></p><button class="btn btnL" onclick="msg('Estou a caminho!')">📨 ESTOU A CAMINHO</button><button class="btn btnV" onclick="msg('Cheguei no local!')">📍 CHEGUEI NO LOCAL</button><button class="btn btnP" onclick="embarcou()">🏁 EMBARCOU</button><button class="btn" style="background:#666;color:#fff" onclick="mostrarPagamento()">💰 FINALIZAR E RECEBER</button></div>

<!-- TELA PAGAMENTO COM QR CODE -->
<div class="card et" id="pag" style="text-align:center;border:3px solid #32bcad"><h2>💰 RECEBER</h2><h1 id="pagValorFinal">R$ 0</h1><p id="infoPag" style="font-weight:bold;color:red"></p>

<div id="boxNaoPago">
<button class="btn btnV" onclick="recebeu('DINHEIRO')">💵 RECEBI EM DINHEIRO</button>
<button class="btn btnPix" onclick="gerarQR()">📱 GERAR QR CODE PIX NA HORA</button>
<div id="qrBox"><b>QR CODE PIX - Valor da corrida</b><br><br><img id="imgQR" src="" style="width:200px;border:8px solid #fff;border-radius:12px"><br><br>Chave: <b style="background:#000;color:#00ff88;padding:5px 10px;border-radius:8px">77988054875</b><br><small>Silvano - Banco</small><br><br><button class="btn btnV" onclick="recebeu('PIX')">✅ CONFIRMAR QUE RECEBI NO PIX</button></div>
</div>

<div id="boxPago" style="display:none"><p style="background:#d4edda;color:#155724;padding:12px;border-radius:10px"><b>✅ JÁ PAGO NO PIX</b></p><button class="btn btnP" onclick="recebeu('PAGO')">✔️ CONCLUIR</button></div>

</div>

<script>
let map=L.map('map',{zoomControl:false}).setView([-14.866,-40.839],15)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map)
let eu=L.marker([-14.866,-40.839]).addTo(map)
let mk1,mk2,linha,online=false,saldo=0,dados={},paxLat=0,paxLng=0,dLat=0,dLng=0,navegando=false
if(navigator.geolocation){navigator.geolocation.watchPosition(p=>{eu.setLatLng([p.coords.latitude,p.coords.longitude]);if(navegando)map.setView([p.coords.latitude,p.coords.longitude],18)},null,{enableHighAccuracy:true})}
function toggle(){online=!online;let sw=document.getElementById('sw');if(online){sw.classList.add('on');document.getElementById('txt').innerText='ONLINE';buscar()}else{sw.classList.remove('on');document.getElementById('txt').innerText='OFFLINE';document.getElementById('on').classList.remove('on');document.getElementById('run').classList.remove('on');document.getElementById('pag').classList.remove('on');document.getElementById('off').classList.add('on');document.getElementById('navTop').style.display='none';navegando=false}}
function buscar(){setTimeout(()=>{let b=(Math.random()*1+0.3).toFixed(1),l=(Math.random()*3+1).toFixed(1),t=(parseFloat(b)+parseFloat(l)).toFixed(1),v=(2.5+parseFloat(t)*1.8).toFixed(2);let forma=Math.random()>0.5?'DINHEIRO':'PIX';let pago=forma==='PIX';dados={v,forma,pago};document.getElementById('kmB').innerText=b+' km';document.getElementById('kmL').innerText=l+' km';document.getElementById('kmTop').innerText=t+' km';document.getElementById('valor').innerText='R$ '+v.replace('.',',');document.getElementById('pagForma').innerText=forma;document.getElementById('pagStatus').innerText=pago?'(PAGO)':'(NÃO PAGO)';let lat=eu.getLatLng().lat,lng=eu.getLatLng().lng;paxLat=lat+(Math.random()*0.01-0.005);paxLng=lng+(Math.random()*0.01-0.005);dLat=paxLat+(Math.random()*0.02-0.01);dLng=paxLng+(Math.random()*0.02-0.01);if(mk1)map.removeLayer(mk1);if(mk2)map.removeLayer(mk2);if(linha)map.removeLayer(linha);mk1=L.marker([paxLat,paxLng]).addTo(map);mk2=L.marker([dLat,dLng]).addTo(map);linha=L.polyline([[lat,lng],[paxLat,paxLng],[dLat,dLng]],{color:'#0066ff',weight:7}).addTo(map);map.fitBounds(linha.getBounds(),{padding:[40,40]});document.getElementById('off').classList.remove('on');document.getElementById('on').classList.add('on')},1000)}
function aceitar(){document.getElementById('on').classList.remove('on');document.getElementById('run').classList.add('on');document.getElementById('navTop').style.display='flex';document.getElementById('runValor').innerText=document.getElementById('valor').innerText;document.getElementById('runPag').innerText=dados.forma+(dados.pago?' PAGO':' NÃO PAGO');navegando=true;map.setView(eu.getLatLng(),18)}
function msg(t){let x=document.getElementById('toast');x.innerText='✅ '+t;x.style.display='block';setTimeout(()=>x.style.display='none',3000)}
function embarcou(){linha.setLatLngs([[eu.getLatLng().lat,eu.getLatLng().lng],[dLat,dLng]])}
function mostrarPagamento(){document.getElementById('run').classList.remove('on');document.getElementById('pag').classList.add('on');document.getElementById('navTop').style.display='none';document.getElementById('pagValorFinal').innerText=document.getElementById('valor').innerText;document.getElementById('infoPag').innerText=dados.pago?'✅ JÁ PAGO NO PIX':'⚠️ NÃO PAGO - Pediu em '+dados.forma;document.getElementById('qrBox').style.display='none';if(dados.pago){document.getElementById('boxPago').style.display='block';document.getElementById('boxNaoPago').style.display='none'}else{document.getElementById('boxPago').style.display='none';document.getElementById('boxNaoPago').style.display='block'}}
function gerarQR(){let valor=dados.v;let chave='77988054875';let payload='PIX '+chave+' VALOR R$'+valor;let url='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(payload+' | VOO APP');document.getElementById('imgQR').src=url;document.getElementById('qrBox').style.display='block';msg('QR CODE GERADO - R$ '+valor)}
function recebeu(t){saldo+=parseFloat(dados.v);document.getElementById('saldo').innerText=saldo.toFixed(2).replace('.',',');msg('Recebido em '+t);document.getElementById('pag').classList.remove('on');document.getElementById('off').classList.add('on');navegando=false;if(linha)map.removeLayer(linha);buscar()}
</script></body></html>
