<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOO Motorista</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;overflow:hidden}#map{height:100vh;width:100%;position:absolute;top:0;left:0;z-index:1}.topo{position:absolute;top:0;left:0;right:0;z-index:1000;background:#000;color:#fff;padding:12px;display:flex;justify-content:space-between}.onlineBtn{padding:8px 16px;border-radius:20px;border:none;font-weight:bold;background:#333;color:#fff}.onlineBtn.on{background:#00c853;color:#000}.navUber{position:absolute;top:60px;left:10px;right:10px;z-index:900;background:#fff;border-radius:16px;padding:12px;display:none;justify-content:space-between}.sheet{position:absolute;bottom:0;left:0;right:0;z-index:1000;background:#fff;border-radius:24px 24px 0 0;padding-bottom:20px}.handle{width:40px;height:5px;background:#ddd;margin:10px auto;border-radius:10px}.sheetCont{padding:10px 20px}.preco{font-size:32px;font-weight:900}.btnUber{width:100%;padding:16px;border:none;border-radius:12px;font-weight:800;margin-top:8px}.btnBlack{background:#000;color:#fff}.et{display:none}.et.on{display:block}#btnMinimizar,#btnVerCorrida,#btnChegou,#btnCancelar{position:absolute;z-index:1100;left:20px;right:20px;padding:16px;border:none;border-radius:16px;font-weight:900;display:none}#btnMinimizar{bottom:100px;background:#000;color:#fff;left:50%;right:auto;transform:translateX(-50%)}#btnVerCorrida{bottom:30px;background:#000;color:#fff}#btnChegou{bottom:30px;background:#00c853;color:#000;font-size:18px}#btnCancelar{bottom:90px;background:#ff4444;color:#fff}</style>
</head><body>
<div id="map"></div>
<div class="topo"><div><b>🚗 VOO</b> R$ <span id="saldo">0,00</span></div><button class="onlineBtn" id="btnOn" onclick="toggle()">FICAR ONLINE</button></div>
<div class="navUber" id="navUber"><div><small>GPS</small><br><b id="navTxt">Buscando</b></div></div>
<button id="btnMinimizar" onclick="minimizar()">▼ MINIMIZAR</button>
<button id="btnVerCorrida" onclick="verCorrida()">▲ VER CORRIDA</button>
<button id="btnChegou" onclick="embarcou()">📍 CHEGUEI NO PASSAGEIRO</button>
<button id="btnCancelar" onclick="cancelarTudo()">❌ CANCELAR CORRIDA</button>

<div class="sheet" id="sheetNova"><div class="handle"></div><div class="sheetCont">
<span style="background:#000;color:#0f8;padding:4px 10px;border-radius:20px;font-size:12px" id="kmTop">0 km</span>
<div class="preco" id="valor">R$ 0</div><small id="formaTop"></small><br><br>
📍 Buscar <b id="kmB"></b> | 🏁 Levar <b id="kmL"></b><br><br>
<button class="btnUber btnBlack" onclick="aceitar()">✅ ACEITAR CORRIDA</button>
<button class="btnUber" style="background:#fff;border:2px solid #000" onclick="recusar()">❌ RECUSAR</button>
</div></div>

<div class="sheet et" id="sheetPag"><div class="handle"></div><div class="sheetCont" style="text-align:center">
<h2>💰 RECEBER</h2><div class="preco" id="pagValor">R$ 0</div><p id="infoPag" style="color:red;font-weight:bold"></p>
<button class="btnUber btnBlack" onclick="finalizar()">CONCLUIR</button>
</div></div>

<script>
let map=L.map('map',{zoomControl:false,attributionControl:false}).setView([-14.866,-40.839],16)
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map)
let eu=L.marker([-14.866,-40.839]).addTo(map),mk1,mk2,linha,online=false,saldo=0,dados={}
if(navigator.geolocation){navigator.geolocation.watchPosition(p=>{eu.setLatLng([p.coords.latitude,p.coords.longitude])},null,{enableHighAccuracy:true})}
function toggle(){online=!online;document.getElementById('btnOn').classList.toggle('on',online);document.getElementById('btnOn').innerText=online?'● ONLINE':'OFFLINE';if(online){buscar();document.getElementById('navUber').style.display='flex'}else location.reload()}
function buscar(){setTimeout(()=>{let b=(Math.random()*1+0.3).toFixed(1),l=(Math.random()*3+1).toFixed(1),v=(2.5+(parseFloat(b)+parseFloat(l))*1.8).toFixed(2);dados={v,forma:'DINHEIRO'};document.getElementById('kmB').innerText=b+'km';document.getElementById('kmL').innerText=l+'km';document.getElementById('kmTop').innerText=(parseFloat(b)+parseFloat(l)).toFixed(1)+'km';document.getElementById('valor').innerText='R$ '+v.replace('.',',');document.getElementById('formaTop').innerText='DINHEIRO';let lat=eu.getLatLng().lat,lng=eu.getLatLng().lng;if(mk1)map.removeLayer(mk1);if(mk2)map.removeLayer(mk2);if(linha)map.removeLayer(linha);mk1=L.marker([lat+0.005,lng+0.005]).addTo(map);mk2=L.marker([lat+0.015,lng+0.015]).addTo(map);linha=L.polyline([[lat,lng],[lat+0.005,lng+0.005],[lat+0.015,lng+0.015]],{color:'#00ff88',weight:6}).addTo(map);map.fitBounds(linha.getBounds(),{padding:[100,100]});document.getElementById('sheetNova').style.display='block'},500)}
function aceitar(){document.getElementById('sheetNova').style.display='none';document.getElementById('btnMinimizar').style.display='block';document.getElementById('btnChegou').style.display='block';document.getElementById('btnCancelar').style.display='block';map.setView(eu.getLatLng(),18)}
function minimizar(){document.getElementById('sheetNova').style.display='none';document.getElementById('btnMinimizar').style.display='none';document.getElementById('btnVerCorrida').style.display='block'}
function verCorrida(){document.getElementById('sheetNova').style.display='block';document.getElementById('btnMinimizar').style.display='block';document.getElementById('btnVerCorrida').style.display='none'}
function recusar(){alert('Recusada');document.getElementById('sheetNova').style.display='none';if(mk1)map.removeLayer(mk1);if(mk2)map.removeLayer(mk2);if(linha)map.removeLayer(linha);buscar()}
function cancelarTudo(){if(confirm('Cancelar mesmo? Carro quebrou / engano?'))location.reload()}
function embarcou(){if(mk1)map.removeLayer(mk1);let destino=linha.getLatLngs()[2];let pos=eu.getLatLng();linha.setLatLngs([pos,destino]);map.fitBounds(linha.getBounds(),{padding:[80,80]});document.getElementById('navTxt').innerText='Levando ao destino';document.getElementById('btnChegou').innerText='🏁 CHEGUEI NO DESTINO';document.getElementById('btnChegou').onclick=cheguei}
function cheguei(){document.getElementById('btnChegou').style.display='none';document.getElementById('btnCancelar').style.display='none';document.getElementById('btnMinimizar').style.display='none';document.getElementById('sheetPag').classList.add('on');document.getElementById('pagValor').innerText=document.getElementById('valor').innerText}
function finalizar(){saldo+=parseFloat(dados.v);document.getElementById('saldo').innerText=saldo.toFixed(2).replace('.',',');document.getElementById('sheetPag').classList.remove('on');buscar()}
</script></body></html>
