<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOO - Painel PRO com GPS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f0f4f8}
.topo{background:#0a2540;color:white;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}
.online-box{background:white;margin:10px;padding:12px 15px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.switch{width:60px;height:32px;background:#ccc;border-radius:20px;position:relative;cursor:pointer}
.switch.ativo{background:#00c853}
.bola{width:28px;height:28px;background:white;border-radius:50%;position:absolute;top:2px;left:2px;transition:.3s}
.switch.ativo .bola{left:30px}
#map{height:280px;width:100%;z-index:1}
.card{background:white;margin:10px;padding:14px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.info{display:flex;justify-content:space-between;margin:8px 0;font-size:14px}
.info b{color:#0a2540}
.valor{font-size:22px;color:#00c853;font-weight:bold}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin-top:8px;cursor:pointer}
.btn-verde{background:#00c853;color:white}
.btn-azul{background:#0a2540;color:white}
.btn-laranja{background:#ff9800;color:white}
.btn-cinza{background:#eee;color:#333}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<div class="topo">
<div><b>🚗 VOO MOTORISTA</b><br><small id="nome">Silvano | Gol 2015</small></div>
<div style="text-align:right"><small>SALDO</small><br><b>R$ <span id="saldo">0,00</span></b></div>
</div>

<div class="online-box">
<div><b id="status">🔴 OFFLINE</b><br><small id="sub">Fique online pra receber em Conquista</small></div>
<div class="switch" id="sw" onclick="toggle()"><div class="bola"></div></div>
</div>

<div id="map"></div>

<div id="area">
<div class="card" style="text-align:center;color:#666">
📡 Ative o ONLINE para o GPS começar a procurar corridas em Vitória da Conquista
</div>
</div>

<script>
let online=false;
let map, driverMarker, rota;
let driverLat=-14.861,-14.861; // Centro de Conquista
let driverLng=-40.844;
let saldo=0;

map=L.map('map').setView([-14.861, -40.844], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
driverMarker=L.marker([-14.861, -40.844]).addTo(map).bindPopup("Você aqui").openPopup();

if(navigator.geolocation){
 navigator.geolocation.watchPosition(pos=>{
  driverLat=pos.coords.latitude;
  driverLng=pos.coords.longitude;
  driverMarker.setLatLng([driverLat, driverLng]);
  if(online) map.setView([driverLat, driverLng], 15);
 },null,{enableHighAccuracy:true});
}

function calcKm(lat1,lon1,lat2,lon2){
 const R=6371;
 const dLat=(lat2-lat1)*Math.PI/180;
 const dLon=(lon2-lon1)*Math.PI/180;
 const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function toggle(){
 online=!online;
 document.getElementById('sw').classList.toggle('ativo',online);
 document.getElementById('status').innerText=online?'🟢 ONLINE - GPS ATIVO':'🔴 OFFLINE';
 document.getElementById('sub').innerText=online?'Procurando corridas...':'Fique online';
 if(online) buscar();
 else document.getElementById('area').innerHTML='<div class=card style=text-align:center>🔴 Offline</div>';
}

function buscar(){
 if(!online) return;
 document.getElementById('area').innerHTML='<div class=card style=text-align:center>📡 Buscando passageiro perto de você...</div>';
 setTimeout(mostrarCorrida, 2500);
}

function mostrarCorrida(){
 if(!online) return;
 // Simula corrida real em Conquista
 const origem={lat:-14.864, lng:-40.835, nome:"Shopping Conquista Sul - Entrada Principal"};
 const destino={lat:-14.886, lng:-40.807, nome:"UESB - Campus Universitário"};
 
 const kmBuscar=calcKm(driverLat,driverLng,origem.lat,origem.lng);
 const kmLevar=calcKm(origem.lat,origem.lng,destino.lat,destino.lng);
 const kmTotal=kmBuscar+kmLevar;
 const valor= (kmLevar*2.5 + 4).toFixed(2); // R$2,50 por km + bandeirada
 const valorKm=(valor/kmLevar).toFixed(2);

 if(rota) map.removeLayer(rota);
 rota=L.polyline([[driverLat,driverLng],[origem.lat,origem.lng],[destino.lat,destino.lng]],{color:'#0a2540',weight:5}).addTo(map);
 L.marker([origem.lat,origem.lng]).addTo(map).bindPopup("Buscar aqui");
 L.marker([destino.lat,destino.lng]).addTo(map).bindPopup("Levar aqui");
 map.fitBounds(rota.getBounds(),{padding:[30,30]});

 if(navigator.vibrate) navigator.vibrate([300,100,300]);

 document.getElementById('area').innerHTML=`
 <div class="card" style="border-left:6px solid #00c853">
  <b>🔔 NOVA CORRIDA - VITORIA DA CONQUISTA</b><br><br>
  <div class="info"><span>📍 Buscar em:</span><b>${origem.nome}</b></div>
  <div class="info"><span>🏁 Levar para:</span><b>${destino.nome}</b></div>
  <hr style="margin:10px 0">
  <div class="grid2">
   <div style="background:#f5f5f5;padding:8px;border-radius:8px;text-align:center"><small>ATÉ PASSAGEIRO</small><br><b>${kmBuscar.toFixed(1)} km</b></div>
   <div style="background:#f5f5f5;padding:8px;border-radius:8px;text-align:center"><small>CORRIDA</small><br><b>${kmLevar.toFixed(1)} km</b></div>
  </div>
  <div class="info"><span>Total:</span><b>${kmTotal.toFixed(1)} km</b></div>
  <div class="info"><span>Valor corrida:</span><span class="valor">R$ ${valor}</span></div>
  <div class="info"><span>Valor por KM:</span><b>R$ ${valorKm}/km</b></div>
  <div class="info"><span>Passageiro:</span><b>Ana - ⭐ 4.9</b></div>
  <button class="btn btn-verde" onclick="aceitar(${valor},${kmLevar})">✅ ACEITAR - R$ ${valor}</button>
  <button class="btn btn-cinza" onclick="buscar()">❌ CANCELAR / RECUSAR</button>
 </div>`;
}

function aceitar(valor, km){
 document.getElementById('area').innerHTML=`
 <div class="card" style="border-left:6px solid #0a2540">
  <b>🚗 CORRIDA ACEITA! GPS traçando rota</b><br><br>
  <div class="info"><span>Valor:</span><b style="color:#00c853">R$ ${valor.toFixed(2)}</b></div>
  <p style="margin:10px 0;font-size:14px">📍 Vá até: Shopping Conquista Sul</p>
  <a href="https://wa.me/5577988887777?text=Olá! Sou seu motorista do VOO, estou a caminho! Já estou a ${calcKm(driverLat,driverLng,-14.864,-40.835).toFixed(1)}km de você 🚗" target="_blank"><button class="btn btn-azul">💬 ESTOU A CAMINHO (WhatsApp)</button></a>
  <button class="btn btn-laranja" onclick="cheguei(${valor},${km})">📍 CHEGUEI NO LOCAL</button>
  <button class="btn btn-cinza" onclick="cancelar()">❌ CANCELAR CORRIDA</button>
 </div>`;
}

function cheguei(valor, km){
 document.getElementById('area').innerHTML=`
 <div class="card" style="border-left:6px solid #ff9800">
  <b>📍 VOCÊ CHEGOU!</b><br><br>
  <p>Avisando passageiro...</p>
  <a href="https://wa.me/5577988887777?text=Cheguei! Estou te esperando na entrada principal 🚗 VOO" target="_blank"><button class="btn btn-azul">💬 AVISAR QUE CHEGUEI</button></a>
  <button class="btn btn-verde" onclick="emCorrida(${valor},${km})">▶️ INICIAR CORRIDA</button>
 </div>`;
}

function emCorrida(valor, km){
 document.getElementById('area').innerHTML=`
 <div class="card" style="border-left:6px solid #ff9800">
  <b>🏁 EM CORRIDA - GPS NAVEGANDO ATÉ UESB</b><br>
  <small>${km} km - R$ ${valor.toFixed(2)}</small><br><br>
  <button class="btn btn-verde" onclick="finalizar(${valor})">💰 FINALIZAR CORRIDA</button>
 </div>`;
}

function finalizar(valor){
 saldo+=valor;
 document.getElementById('saldo').innerText=saldo.toFixed(2).replace('.',',');
 document.getElementById('area').innerHTML=`<div class="card" style="background:#e8f5e9;text-align:center"><b>✅ FINALIZADA! + R$ ${valor.toFixed(2)}</b><br><small>R$ ${(valor/2.5).toFixed(1)}/km - Você ganhou bem!</small></div>`;
 setTimeout(buscar,3000);
}

function cancelar(){
 document.getElementById('area').innerHTML='<div class=card style=text-align:center>Corrida cancelada<br><small>Buscando nova...</small></div>';
 setTimeout(buscar,2000);
}
</script>
</body>
</html>
