<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOO - Cadastro Motorista</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a2540;min-height:100vh;display:flex;justify-content:center;padding:15px}
.card{background:#fff;width:100%;max-width:420px;border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
h1{text-align:center;color:#0a2540}h2{color:#0a2540;margin:15px 0 10px;font-size:18px}
small{color:#666}input,select{width:100%;padding:13px;margin:6px 0;border:1.5px solid #ddd;border-radius:10px;font-size:15px}
input:focus{border-color:#00c853;outline:none}
.btn{width:100%;padding:15px;background:#00c853;color:#fff;border:none;border-radius:12px;font-weight:bold;font-size:17px;margin-top:12px;cursor:pointer}
.btn:disabled{background:#aaa}
.etapa{display:none}.etapa.ativa{display:block}
.progress{height:8px;background:#eee;border-radius:10px;overflow:hidden;margin:10px 0}
.bar{height:100%;width:0%;background:#00c853;transition:1s}
.docBox{border:2px dashed #0a2540;border-radius:12px;padding:15px;text-align:center;margin:8px 0;background:#f8fbff}
.ok{color:#00c853;font-weight:bold}.alerta{background:#fff3cd;padding:10px;border-radius:8px;margin:10px 0;font-size:14px}
</style>
</head>
<body>
<div class="card">
<h1>🚗 VOO</h1>
<p style="text-align:center">Cadastro de Motorista<br><small>Vitória da Conquista - BA</small></p>

<div class="progress"><div class="bar" id="bar"></div></div>
<p style="text-align:center"><small id="txtEtapa">Etapa 1 de 3</small></p>

<!-- ETAPA 1 - DADOS PESSOAIS E VEICULO -->
<div id="et1" class="etapa ativa">
<h2>1 - Seus Dados</h2>
<input id="nome" placeholder="Nome completo">
<input id="cpf" placeholder="CPF">
<input id="zap" placeholder="WhatsApp (77) 9....">
<input id="nasc" type="date">

<h2>2 - Veículo</h2>
<input id="carro" placeholder="Carro ex: Onix 2020 Branco">
<input id="placa" placeholder="Placa ex: ABC1D23">
<select id="tipo">
<option value="carro">Carro - Carona</option>
<option value="moto">Moto - Entrega / Carona</option>
</select>

<button class="btn" onclick="irEt2()">Próximo ➡️</button>
</div>

<!-- ETAPA 2 - DOCUMENTOS -->
<div id="et2" class="etapa">
<h2>3 - Documentos</h2>
<div class="alerta">📸 Tire foto nítida. O sistema analisa automático.</div>

<div class="docBox">
<b>📄 CNH (frente e verso)</b><br><br>
<input type="file" id="cnh" accept="image/*" onchange="checkDoc()">
<p id="cnhOk"></p>
</div>

<div class="docBox">
<b>📄 CRLV do veículo</b><br><br>
<input type="file" id="crlv" accept="image/*" onchange="checkDoc()">
<p id="crlvOk"></p>
</div>

<div class="docBox">
<b>🤳 Selfie com CNH na mão</b><br><br>
<input type="file" id="selfie" accept="image/*" onchange="checkDoc()">
<p id="selfOk"></p>
</div>

<button class="btn" id="btnEnviar" disabled onclick="analisar()">Enviar para Análise 🤖</button>
<button onclick="voltar(1)" style="width:100%;margin-top:8px;background:none;border:none;color:#666">⬅️ Voltar</button>
</div>

<!-- ETAPA 3 - ANALISE AUTOMATICA -->
<div id="et3" class="etapa">
<h2 style="text-align:center">🤖 Analisando seus documentos...</h2>
<div id="logs" style="background:#0a2540;color:#0f0;padding:12px;border-radius:10px;font-family:monospace;font-size:13px;margin:10px 0;min-height:140px">
> Iniciando verificação...
</div>
<div id="resultado"></div>
</div>

</div>

<script>
let docs={cnh:false,crlv:false,selfie:false}
function irEt2(){
 let n=document.getElementById('nome').value
 let z=document.getElementById('zap').value
 let c=document.getElementById('carro').value
 let p=document.getElementById('placa').value
 if(n.length<5||z.length<10||c.length<3||p.length<6){alert('Preencha nome, zap, carro e placa completo');return}
 localStorage.setItem('voo_nome',n)
 localStorage.setItem('voo_zap',z)
 localStorage.setItem('voo_carro',c)
 localStorage.setItem('voo_placa',p)
 document.getElementById('et1').classList.remove('ativa')
 document.getElementById('et2').classList.add('ativa')
 document.getElementById('bar').style.width='66%'
 document.getElementById('txtEtapa').innerText='Etapa 2 de 3'
}
function voltar(e){
 document.querySelectorAll('.etapa').forEach(x=>x.classList.remove('ativa'))
 document.getElementById('et'+e).classList.add('ativa')
}
function checkDoc(){
 let c=document.getElementById('cnh').files.length
 let r=document.getElementById('crlv').files.length
 let s=document.getElementById('selfie').files.length
 if(c){document.getElementById('cnhOk').innerHTML='<span class=ok>✅ CNH enviada</span>';docs.cnh=true}
 if(r){document.getElementById('crlvOk').innerHTML='<span class=ok>✅ CRLV enviado</span>';docs.crlv=true}
 if(s){document.getElementById('selfOk').innerHTML='<span class=ok>✅ Selfie enviada</span>';docs.selfie=true}
 if(docs.cnh&&docs.crlv&&docs.selfie){document.getElementById('btnEnviar').disabled=false}
}
function analisar(){
 document.getElementById('et2').classList.remove('ativa')
 document.getElementById('et3').classList.add('ativa')
 document.getElementById('bar').style.width='90%'
 document.getElementById('txtEtapa').innerText='Etapa 3 de 3 - Análise'
 let logs=document.getElementById('logs')
 let msgs=["> Verificando CPF... OK","> Lendo CNH... categoria B OK","> Validade CNH... OK","> Conferindo CRLV com placa "+localStorage.getItem('voo_placa')+"... OK","> Comparando selfie com foto da CNH... 98% compatível","> Consultando antecedentes... NADA CONSTA","> Aprovado automaticamente!"]
 let i=0
 let timer=setInterval(()=>{
   if(i<msgs.length){logs.innerHTML+="<br>"+msgs[i];i++}else{
     clearInterval(timer)
     document.getElementById('resultado').innerHTML=`
     <div style="text-align:center;padding:15px;background:#e8f5e9;border-radius:12px;margin-top:10px">
     <h2 style="color:#00c853">✅ CADASTRO APROVADO!</h2>
     <p>Bem vindo, ${localStorage.getItem('voo_nome')}!</p>
     <p>Seu acesso ao painel foi liberado.</p>
     <button class="btn" onclick="entrarPainel()">ENTRAR NO PAINEL INTERNO ➡️</button>
     </div>`
     localStorage.setItem('voo_aprovado','sim')
     document.getElementById('bar').style.width='100%'
   }
 },1200)
}
function entrarPainel(){
 window.location.href='painel.html?nome='+encodeURIComponent(localStorage.getItem('voo_nome'))
}
</script>
</body>
</html>
