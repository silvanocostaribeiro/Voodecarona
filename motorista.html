<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VOO - Cadastro Motorista</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;color:#fff;padding:20px}
.logo{font-size:32px;font-weight:900;text-align:center;margin:20px 0}
.logo span{color:#00ff88}
.card{background:#fff;color:#000;border-radius:20px;padding:22px}
h2{font-size:22px;margin-bottom:4px}
.sub{color:#666;font-size:13px;margin-bottom:16px}
label{font-weight:800;font-size:13px;margin:14px 0 6px;display:block}
input,select{width:100%;padding:14px;border-radius:10px;border:2px solid #ddd;font-size:15px}
input:focus{border-color:#000;outline:none}
.row{display:flex;gap:10px}
.row>div{flex:1}
.btn{width:100%;padding:18px;border:none;border-radius:12px;font-weight:900;font-size:16px;margin-top:20px;background:#000;color:#fff}
.btn:disabled{background:#ccc}
.ok{background:#d4edda;padding:10px;border-radius:8px;font-size:12px;margin-top:10px;display:none}
.fotoBox{border:2px dashed #000;border-radius:12px;padding:20px;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="logo">VOO<span>.</span></div>
<div class="card">
<h2>Seja motorista VOO 🚗</h2>
<p class="sub">Cadastro aprovado na hora, automático</p>

<label>Nome completo</label>
<input id="nome" placeholder="Ex: João Silva">

<label>WhatsApp</label>
<input id="zap" placeholder="(77) 99999-9999" inputmode="numeric">

<div class="row">
<div><label>CPF</label><input id="cpf" placeholder="000.000.000-00"></div>
<div><label>Cidade</label><select id="cidade"><option>Vitória da Conquista</option><option>Barra do Choça</option><option>Outra</option></select></div>
</div>

<label>Tipo de veículo</label>
<select id="tipo"><option>Moto</option><option>Carro</option></select>

<div class="row">
<div><label>Placa</label><input id="placa" placeholder="ABC1D23" style="text-transform:uppercase"></div>
<div><label>Modelo</label><input id="modelo" placeholder="Ex: CG 160 / Onix"></div>
</div>

<label>Cor do veículo</label>
<input id="cor" placeholder="Ex: Preta">

<label>Foto da CNH ou RG (leitura automática)</label>
<div class="fotoBox" onclick="document.getElementById('file').click()">
<div id="fotoTxt">📷 CLIQUE PARA TIRAR FOTO<br><small style="color:#666">Vamos ler automaticamente</small></div>
<input type="file" id="file" accept="image/*" capture="environment" style="display:none" onchange="lerFoto(this)">
</div>
<div id="okLeitura" class="ok">✅ Documento lido com sucesso! Nome confirmado.</div>

<button class="btn" id="btnCad" onclick="cadastrar()">CADASTRAR E COMEÇAR A TRABALHAR →</button>
<p style="font-size:11px;color:#666;text-align:center;margin-top:12px">Ao cadastrar você aceita os termos do VOO. Aprovação 100% automática.</p>
</div>

<script>
let docLido = false
function lerFoto(input){
  if(input.files && input.files[0]){
    document.getElementById('fotoTxt').innerHTML='⏳ LENDO DOCUMENTO...<br><small>IA analisando</small>'
    // SIMULA LEITURA AUTOMÁTICA
    setTimeout(()=>{
      document.getElementById('fotoTxt').innerHTML='✅ FOTO LIDA<br><small>Documento ok</small>'
      document.getElementById('okLeitura').style.display='block'
      docLido = true
      // Preenche automático se quiser
      // document.getElementById('nome').value = "Nome lido da foto"
    },2000)
  }
}

function cadastrar(){
  let nome=document.getElementById('nome').value.trim()
  let zap=document.getElementById('zap').value.trim()
  let placa=document.getElementById('placa').value.trim()
  let modelo=document.getElementById('modelo').value.trim()

  if(!nome ||!zap ||!placa ||!modelo){
    alert('Preenche nome, whatsapp, placa e modelo')
    return
  }
  if(!docLido){
    if(!confirm('Sem foto do documento? Pode cadastrar mesmo assim e enviar depois. Continuar?')) return
  }

  document.getElementById('btnCad').innerText='⏳ APROVANDO AUTOMATICAMENTE...'
  document.getElementById('btnCad').disabled=true

  // SALVA TUDO NO CELULAR DELE - APROVAÇÃO AUTOMÁTICA
  let motorista={
    nome:nome,
    zap:zap,
    cpf:document.getElementById('cpf').value,
    placa:placa.toUpperCase(),
    modelo:modelo,
    cor:document.getElementById('cor').value,
    tipo:document.getElementById('tipo').value,
    cidade:document.getElementById('cidade').value,
    aprovado:true,
    dataCadastro:new Date().toISOString()
  }
  localStorage.setItem('voo_motorista',JSON.stringify(motorista))
  localStorage.setItem('voo_aprovado','true')

  // SIMULA ANÁLISE AUTOMÁTICA DE 2 SEGUNDOS
  setTimeout(()=>{
    alert('✅ APROVADO AUTOMATICAMENTE!\n\nBem-vindo '+nome+'!\nSua placa '+placa.toUpperCase()+' foi liberada.\n\nJá vai abrir o app pra trabalhar.')
    // JOGA PRA PÁGINA INTERNA QUE VOCÊ MOSTROU NO ÁUDIO
    window.location.href='motorista.html?v=cadastro-aprovado'
  },2000)
}
</script>
</body>
</html>
