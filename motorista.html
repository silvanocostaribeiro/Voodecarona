<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VOO Motorista - FINAL UNICO</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;overflow:hidden}
#map{position:absolute;inset:0;z-index:1}
.topo{position:absolute;top:0;left:0;right:0;z-index:1000;background:#000;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.saldo{font-weight:900}
.saldo b{color:#00ff88}
.btnOn{padding:10px 18px;border-radius:24px;border:none;font-weight:900;background:#222;color:#fff;border:1px solid #444}
.btnOn.on{background:#fff;color:#000}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:1100;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;max-height:90vh;transition:0.3s}
.handleArea{padding:12px 0;display:flex;justify-content:center}
.handle{width:40px;height:5px;background:#ddd;border-radius:10px}
.cont{padding:0 20px 20px;overflow-y:auto}
.price{font-size:42px;font-weight:900}
.bairroG{font-size:20px;font-weight:900}
.route{position:relative;padding-left:28px;margin:12px 0}
.route:before{content:'';position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:#000}
.dot{position:absolute;left:2px;width:14px;height:14px;border-radius:50%;border:3px solid #000;background:#fff}
.dot.start{top:0}.dot.end{bottom:0;background:#000}
.btnUber{width:100%;padding:18px;border:none;border-radius:12px;font-weight:900;font-size:16px;margin-top:10px}
.btnGreen{background:#000;color:#fff}.btnRed{background:#fff;color:#c00;border:2px solid #fcc}
.sliderUber{position:relative;background:#000;border-radius:30px;height:56px;display:flex;align-items:center;padding:4px;margin-top:16px}
.sliderTrack{color:#fff;font-weight:800;text-align:center;flex:1}
.sliderThumb{position:absolute;left:4px;width:48px;height:48px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center}
.timerBar{height:5px;background:#eee;border-radius:10px;overflow:hidden;margin:8px 0}
.timerBar div{height:100%;background:#00c853;width:100%}
</style>
</head>
<body>
<div id="map"></div>
<div class="topo"><div class="saldo">🚗 VOO • R$ <b id="saldo">0,00</b></div><button class="btnOn on" id="btnOn" onclick="toggle()">● ONLINE</button></div>

<div id="sheet">
<div class="handleArea"><div class="handle"></div></div>
<div class="cont" id="cont"></div>
</div>

<script>
let map=L.map('map',{zoomControl:false,attributionControl:false}).setView([-14.866,-40.839],16)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map)
let eu=L.marker([-14.866,-40.839]).addTo(map)
let mk1,mk2,linha,online=true,saldo=Number(localStorage.getItem('saldo')||0),dados={},timerInt,somInt,estado='oferta'
document.getElementById('saldo').innerText=saldo.toFixed(2).replace('.',',')

function tocar(){try{if(somInt)clearInterval(somInt);let ctx=new(window.AudioContext||window.webkitAudioContext)();function bip(){let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='square';o.frequency.value=950;g.gain.setValueAtTime(1,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.4);o.start();o.stop(ctx.currentTime+0.4);setTimeout(()=>{let o2=ctx.createOscillator(),g2=ctx.createGain();o2.connect(g2);g2.connect(ctx.destination);o2.type='square';o2.frequency.value=1200;g2.gain.setValueAtTime(1,ctx.currentTime);g2.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.4);o2.start();o2.stop(ctx.currentTime+0.4)},200)}bip();somInt=setInterval(bip,1300);if(navigator.vibrate)navigator.vibrate([300,100,300])}catch(e){}}
function pararSom(){if(somInt){clearInterval(somInt);somInt=null}if(navigator.vibrate)navigator.vibrate(0)}

function render(){
let c=document.getElementById('cont')
if(estado=='oferta'){
c.innerHTML=`<div style="display:flex;justify-content:space-between"><span id="sec" style="font-weight:900;border:2px solid #000;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center">15</span><span style="background:#000;color:#fff;padding:4px 10px;border-radius:20px;font-size:11px">${dados.forma} • ${dados.dist}km</span></div>
<div class="timerBar"><div id="bar"></div></div>
<div class="price">R$ ${dados.v}</div>
<div class="route"><div class="dot start"></div><div class="bairroG">BUSCAR: ${dados.b1} - ${dados.kmB}km</div><div style="height:18px"></div><div class="dot end"></div><div class="bairroG" style="color:#00a651">LEVAR: ${dados.b2} - ${dados.kmL}km</div></div>
<button class="btnUber btnGreen" onclick="aceitar()">✅ ACEITAR - 1 TOQUE</button>
<button class="btnUber btnRed" onclick="recusar()">❌ RECUSAR</button>`
iniciaTimer()
}else if(estado=='embarque'){
c.innerHTML=`<h3>A caminho de ${dados.b1}</h3><p>📍 ${dados.b1} - ${dados.kmB}km • 4 min</p><p>👤 Passageiro 4.9⭐ - 120 corridas</p><div class="sliderUber" onclick="chegou()"><div class="sliderTrack">ARRASTE / CLIQUE - CHEGUEI →</div><div class="sliderThumb">📍</div></div><button class="btnUber btnRed" onclick="cancelar()">Cancelar corrida</button>`
}else if(estado=='chegou'){
c.innerHTML=`<h3 style="text-align:center">Você chegou em ${dados.b1}</h3><p style="text-align:center">Aguardando passageiro</p><div class="sliderUber" onclick="iniciar()"><div class="sliderTrack">ARRASTE / CLIQUE - INICIAR →</div><div class="sliderThumb">▶️</div></div>`
}else if(estado=='viagem'){
c.innerHTML=`<h3>Levando para ${dados.b2}</h3><p>🏁 ${dados.b2} - ${dados.kmL}km</p><p>💰 R$ ${dados.v} - ${dados.forma}</p><div class="sliderUber" onclick="chegouDestino()"><div class="sliderTrack">ARRASTE / CLIQUE - CHEGUEI NO DESTINO →</div><div class="sliderThumb">🏁</div></div>`
}else if(estado=='pagamento'){
let isPix=dados.forma.includes('PIX')
c.innerHTML=`<div style="text-align:center"><h2>${isPix?'💠 PIX':'💵 DINHEIRO'}</h2><div class="price">R$ ${dados.v}</div><p><b>${dados.forma} - ${dados.b1} → ${dados.b2}</b></p>
${isPix?`<div style="width:200px;height:200px;border:2px dashed #000;margin:12px auto;display:flex;align-items:center;justify-content:center;font-weight:900">QR CODE<br>R$ ${dados.v}<br>PIX VOO</div><button class="btnUber btnGreen" onclick="finalizar()">✅ PIX RECEBIDO</button>`:`<div style="background:#fff3cd;padding:12px;border-radius:10px;margin:12px 0">⚠️ COBRAR R$ ${dados.v} EM DINHEIRO NA MÃO</div><button class="btnUber btnGreen" onclick="finalizar()">✅ DINHEIRO RECEBIDO</button>`}</div>`
}
}

function nova(){
let bairros=['Centro','Candeias','Recreio','Brasil','Patagônia','Ibirapuera','Felícia','Morada Real','UrBis VI','Jatobá','Alto Maron']
let b1=bairros[Math.floor(Math.random()*bairros.length)],b2=bairros[Math.floor(Math.random()*bairros.length)];while(b2==b1){b2=bairros[Math.floor(Math.random()*bairros.length)]}
let kb=(Math.random()*1+0.3).toFixed(1),kl=(Math.random()*2+1).toFixed(1),dist=(parseFloat(kb)+parseFloat(kl)).toFixed(1),v=(3.5+parseFloat(dist)*2.2).toFixed(2)
dados={v:v.replace('.',','),vNum:v,b1:b1,b2:b2,kmB:kb,kmL:kl,dist:dist,forma:Math.random()>0.5?'PIX':'DINHEIRO'}
if(mk1)map.removeLayer(mk1);if(mk2)map.removeLayer(mk2);if(linha)map.removeLayer(linha)
let lat=eu.getLatLng().lat,lng=eu.getLatLng().lng;mk1=L.marker([lat+0.004,lng+0.004]).addTo(map);mk2=L.marker([lat+0.012,lng+0.012]).addTo(map);linha=L.polyline([[lat,lng],[lat+0.004,lng+0.004],[lat+0.012,lng+0.012]],{color:'#000',weight:6}).addTo(map);map.fitBounds(linha.getBounds(),{padding:[80,80]})
estado='oferta';render();tocar()
}
function iniciaTimer(){let t=15;clearInterval(timerInt);timerInt=setInterval(()=>{t--;let el=document.getElementById('sec');let bar=document.getElementById('bar');if(el)el.innerText=t;if(bar)bar.style.width=(t/15*100)+'%';if(t<=0){clearInterval(timerInt);recusar()}},1000)}
function aceitar(){pararSom();clearInterval(timerInt);estado='embarque';render()}
function recusar(){pararSom();clearInterval(timerInt);nova()}
function chegou(){estado='chegou';render()}
function iniciar(){if(mk1)map.removeLayer(mk1);linha.setLatLngs([eu.getLatLng(),linha.getLatLngs()[1]]);estado='viagem';render()}
function chegouDestino(){estado='pagamento';render()}
function finalizar(){saldo+=parseFloat(dados.vNum);localStorage.setItem('saldo',saldo);document.getElementById('saldo').innerText=saldo.toFixed(2).replace('.',',');nova()}
function cancelar(){if(confirm('Cancelar corrida?')){estado='oferta';nova()}}
function toggle(){if(estado!='oferta'){alert('⚠️ Você está em corrida! Finalize antes de ficar offline.');return}online=!online;document.getElementById('btnOn').innerText=online?'● ONLINE':'FICAR ONLINE';document.getElementById('btnOn').classList.toggle('on',online);if(!online){document.getElementById('sheet').style.display='none'}else{document.getElementById('sheet').style.display='flex';nova()}}
if(navigator.geolocation){navigator.geolocation.watchPosition(p=>{eu.setLatLng([p.coords.latitude,p.coords.longitude])},null,{enableHighAccuracy:true})}
nova()
</script>
</body>
</html>
